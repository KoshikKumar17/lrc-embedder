name: Build APK
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Sign with throwaway test key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" \
            -storepass testpass123 -keypass testpass123 \
            -alias test -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Test"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          IN=$(ls app/build/outputs/apk/release/*.apk | head -1)
          OUT=LRC-Embedder-${{ github.ref_name }}-test.apk
          $APKSIGNER sign --ks "$RUNNER_TEMP/test.jks" \
            --ks-pass pass:testpass123 --ks-key-alias test \
            --out "$OUT" "$IN"
          $APKSIGNER verify "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: LRC-Embedder-apk
          path: LRC-Embedder-*.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LRC-Embedder-*.apk
          generate_release_notes: true
